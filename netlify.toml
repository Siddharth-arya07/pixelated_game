# Netlify: build with Vite, serve dist/.
# The HTML entry is built to dist/src/ui/index.html (see vite.config.js),
# so the site root is rewritten to it.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/"
  to = "/src/ui/index.html"
  status = 200

# Hashed assets never change: cache them hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
